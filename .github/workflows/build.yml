name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system libraries for pygame/tk/tts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev libsdl2-mixer-dev libsdl2-image-dev libsdl2-ttf-dev \
            python3-tk \
            espeak-ng

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements-linux.txt

      - name: Build executable with PyInstaller
        run: >
          pyinstaller
          --noconfirm
          --onefile
          --windowed
          --name "RngApp"
          --hidden-import "pynput.keyboard._xorg"
          --hidden-import "pynput.mouse._xorg"
          --hidden-import "darkdetect"
          --collect-data customtkinter
          --add-data "resources/sfx/roll_single.wav:resources/sfx"
          --add-data "resources/sfx/roll_multiple.wav:resources/sfx"
          main.py

      # Zip the output folder so it can be attached to the release as one file
      - name: Zip build output
        run: |
          cd dist
          zip ../RngApp-linux.zip RngApp
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: "Automated build from ${{ github.ref_name }}"
          files: RngApp-linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}